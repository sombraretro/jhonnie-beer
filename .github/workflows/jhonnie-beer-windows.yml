name: Validar e compilar Jhonnie Beer

on:
  push:
    branches:
      - feature/jhonnie-beer-customization
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: python -m pip install --upgrade pillow

      - name: Gerar ícone Windows a partir da logo da adega
        shell: pwsh
        run: |
          python -c "from PIL import Image; im=Image.open('Logo-Jhonnie-Beer.jpeg').convert('RGBA'); im.thumbnail((256,256)); im.save('icon.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes de integração
        run: npm run test:integration

      - name: Compilar interface
        run: npm run build

      - name: Gerar instalador Windows
        run: npx electron-builder --win nsis --x64

      - name: Publicar instalador como artefato de validação
        uses: actions/upload-artifact@v4
        with:
          name: Jhonnie-Beer-Setup
          path: release/Jhonnie-Beer-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
